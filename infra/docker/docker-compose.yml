name: farmview
services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-smart_farm}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      API_PORT: ${API_PORT:-4000}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-smart_farm}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "4000:4000"
    depends_on:
      - db
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 2s
      retries: 20

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    environment:
      WORKER_INTERVAL_SEC: ${WORKER_INTERVAL_SEC:-60}
      OFFLINE_AFTER_MIN: ${OFFLINE_AFTER_MIN:-10}
      ALERT_RH_THRESHOLD: ${ALERT_RH_THRESHOLD:-85}
      ALERT_RH_WARN_MIN: ${ALERT_RH_WARN_MIN:-5}
      ALERT_RH_CRIT_MIN: ${ALERT_RH_CRIT_MIN:-15}
      ALERT_VPD_MIN: ${ALERT_VPD_MIN:-0.35}
      ALERT_VPD_MAX: ${ALERT_VPD_MAX:-1.6}
      ALERT_VPD_WINDOW_MIN: ${ALERT_VPD_WINDOW_MIN:-10}
      ALERT_SOIL_LOW_THRESHOLD: ${ALERT_SOIL_LOW_THRESHOLD:-25}
      ALERT_SOIL_WINDOW_MIN: ${ALERT_SOIL_WINDOW_MIN:-10}
      ALERT_EC_MIN: ${ALERT_EC_MIN:-1.2}
      ALERT_EC_MAX: ${ALERT_EC_MAX:-3.0}
      ALERT_PH_MIN: ${ALERT_PH_MIN:-5.5}
      ALERT_PH_MAX: ${ALERT_PH_MAX:-7.0}
      ALERT_EC_PH_WINDOW_MIN: ${ALERT_EC_PH_WINDOW_MIN:-10}
      ALERT_STUCK_WINDOW_MIN: ${ALERT_STUCK_WINDOW_MIN:-20}
      ALERT_STUCK_EPSILON: ${ALERT_STUCK_EPSILON:-0.001}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-smart_farm}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    depends_on:
      - db
      - redis

  mock-generator:
    build:
      context: ../..
      dockerfile: apps/mock-generator/Dockerfile
    environment:
      MOCK_ENABLED: ${MOCK_ENABLED:-true}
      MOCK_INTERVAL_SEC: ${MOCK_INTERVAL_SEC:-60}
      API_BASE_URL: ${API_BASE_URL:-http://api:4000}
      INGEST_PATH: ${INGEST_PATH:-/v1/ingest}
      API_HEALTH_PATH: ${API_HEALTH_PATH:-/health}
      MOCK_FARM_ID: ${MOCK_FARM_ID:-farm-001}
      MOCK_ZONES: ${MOCK_ZONES:-zone-1,zone-2,zone-3}
      MOCK_DEVICE_IDS: ${MOCK_DEVICE_IDS:-dev-01,dev-02,dev-03}
      MOCK_DEVICE_KEYS: ${MOCK_DEVICE_KEYS:-key1,key2,key3}
      SCENARIO_PROFILE: ${SCENARIO_PROFILE:-realistic}
      SEED: ${SEED:-12345}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      NEXT_PUBLIC_FARM_ID: farm-001
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  timescale_data:
